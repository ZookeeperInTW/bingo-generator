<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>賓果數字產生器</title>
<style>
  :root{
    color-scheme:light;
    --bg:#f3f1ec; --card:#fbfaf7; --line:#dedad2; --text:#2f3e46; --sub:#7d8a90;
    --accent:#4a7b95; --accent-text:#ffffff; --hit:#4a7b95; --danger:#b9534a;
    --bar-h:96px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  .wrap{max-width:480px;margin:0 auto;
    padding:12px 16px calc(var(--bar-h) + 20px + env(safe-area-inset-bottom))}

  /* 上方：低頻設定（幾成幾） */
  .top{display:flex;align-items:center;gap:10px}
  .top .lbl{font-size:13px;color:var(--sub);white-space:nowrap}
  .seg{flex:1;display:flex;gap:6px}
  .seg button{flex:1;font-size:17px;font-weight:600;padding:8px 0;border-radius:10px;
    background:var(--card);color:var(--text);border:1px solid var(--line)}
  .seg button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  .size{font-size:13px;color:var(--sub);text-align:center;margin:8px 0 0}

  /* 中間：目前號碼 */
  .display{
    margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;
    height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .num{font-size:116px;font-weight:700;line-height:1;color:#3f6f88;font-variant-numeric:tabular-nums}
  .num.pop{animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:scale(1);opacity:1}}
  .meta{margin-top:10px;font-size:14px;color:var(--sub)}

  .hist{margin-top:14px;font-size:13px;color:var(--sub);line-height:1.7;word-break:break-all;min-height:22px}
  .hist b{color:var(--text);font-weight:600}
  .board{display:grid;gap:4px;margin-top:12px}
  .cell{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;
    background:var(--card);border:1px solid var(--line);color:var(--sub);font-variant-numeric:tabular-nums}
  .cell.hit{background:var(--hit);border-color:var(--hit);color:var(--accent-text);font-weight:700}
  .cell.last{outline:2px solid #e0a458;outline-offset:1px}

  /* 底部固定：高頻操作（新一局、抽號） */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    background:var(--bg);border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .bar-in{max-width:480px;margin:0 auto;display:flex;gap:10px}
  .bar button{
    font:inherit;font-weight:600;border:0;border-radius:16px;height:68px;
    cursor:pointer;touch-action:manipulation}
  #reset{flex:1;font-size:18px;background:var(--card);color:var(--text);border:1px solid var(--line)}
  #draw{flex:2;font-size:28px;background:var(--accent);color:var(--accent-text)}
  .bar button:active,.seg button:active{transform:scale(.97)}
  .bar button:disabled{opacity:.4}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="lbl">幾 × 幾</span>
    <div class="seg" id="seg">
      <button data-n="5">5</button>
      <button data-n="6">6</button>
      <button data-n="7">7</button>
      <button data-n="8">8</button>
    </div>
  </div>
  <div class="size" id="size"></div>

  <div class="display">
    <div class="num" id="cur">—</div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="hist" id="hist"></div>
  <div class="board" id="board"></div>
</div>

<div class="bar">
  <div class="bar-in">
    <button id="reset">新一局</button>
    <button id="draw">抽號</button>
  </div>
</div>

<script>
(function(){
  var KEY = 'bingo-gen-v1';
  var MIN = 5, MAX = 8;
  var $ = function(id){ return document.getElementById(id); };
  var state = { n: 5, drawn: [] };

  function load(){
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (s && s.n >= MIN && s.n <= MAX && Array.isArray(s.drawn)) {
        state.n = s.n;
        var max = s.n * s.n;
        state.drawn = s.drawn.filter(function(v){ return v >= 1 && v <= max; });
      }
    } catch(e){}
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
  }

  function total(){ return state.n * state.n; }

  function renderBoard(){
    var b = $('board');
    b.style.gridTemplateColumns = 'repeat(' + state.n + ',1fr)';
    var fs = state.n <= 5 ? 20 : state.n <= 8 ? 16 : state.n <= 10 ? 13 : 10;
    var last = state.drawn[state.drawn.length - 1];
    var html = '';
    for (var i = 1; i <= total(); i++) {
      var cls = 'cell';
      if (state.drawn.indexOf(i) !== -1) cls += ' hit';
      if (i === last) cls += ' last';
      html += '<div class="' + cls + '" style="font-size:' + fs + 'px">' + i + '</div>';
    }
    b.innerHTML = html;
  }

  function render(pop){
    var bs = document.querySelectorAll('#seg button');
    for (var k = 0; k < bs.length; k++) bs[k].classList.toggle('on', +bs[k].dataset.n === state.n);
    $('size').textContent = state.n + '×' + state.n + '（1–' + total() + '）';
    var last = state.drawn[state.drawn.length - 1];
    var cur = $('cur');
    cur.textContent = last === undefined ? '—' : last;
    if (pop) { cur.classList.remove('pop'); void cur.offsetWidth; cur.classList.add('pop'); }
    var left = total() - state.drawn.length;
    $('meta').textContent = left === 0 ? '已全部抽完，請按「新一局」' : '已抽 ' + state.drawn.length + ' / 剩 ' + left;
    $('draw').disabled = left === 0;
    $('hist').innerHTML = state.drawn.length
      ? '<b>順序：</b>' + state.drawn.join('、') : '';
    renderBoard();
  }

  function setN(n){
    if (n < MIN || n > MAX || n === state.n) return;
    state.n = n; state.drawn = [];
    save(); render(false);
  }

  $('seg').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (b) setN(parseInt(b.dataset.n, 10));
  });

  $('draw').addEventListener('click', function(){
    var max = total(), pool = [];
    for (var i = 1; i <= max; i++) if (state.drawn.indexOf(i) === -1) pool.push(i);
    if (!pool.length) return;
    var pick = pool[Math.floor(Math.random() * pool.length)];
    state.drawn.push(pick);
    save(); render(true);
  });

  $('reset').addEventListener('click', function(){
    state.drawn = [];   // 保留 n
    save(); render(false);
  });

  // 鎖定畫面：禁止雙指縮放（iOS 忽略 user-scalable=no，需額外處理）
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(t){
    document.addEventListener(t, function(e){ e.preventDefault(); });
  });
  document.addEventListener('touchmove', function(e){
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  load(); render(false);
})();
</script>
</body>
</html>
